<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#2c3e50"/>
  
  <!-- Metronome body -->
  <g transform="translate(96, 96)">
    <!-- Base/stand -->
    <rect x="-35" y="55" width="70" height="8" rx="2" fill="#34495e"/>
    <rect x="-20" y="60" width="40" height="4" fill="#7f8c8d"/>
    
    <!-- Main body (trapezoid-like shape) -->
    <path d="M -30 45 L 30 45 L 25 15 L -25 15 Z" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Clock face background -->
    <circle cx="0" cy="0" r="20" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Clock markers -->
    <g stroke="#2c3e50" stroke-width="1.5">
      <line x1="0" y1="-19" x2="0" y2="-16"/>
      <line x1="13.4" y1="-14.1" x2="12" y2="-11.3"/>
      <line x1="19" y1="0" x2="16" y2="0"/>
      <line x1="13.4" y1="14.1" x2="12" y2="11.3"/>
      <line x1="0" y1="19" x2="0" y2="16"/>
      <line x1="-13.4" y1="14.1" x2="-12" y2="11.3"/>
      <line x1="-19" y1="0" x2="-16" y2="0"/>
      <line x1="-13.4" y1="-14.1" x2="-12" y2="-11.3"/>
    </g>
    
    <!-- Pendulum (swinging rod) - animated appearance with slight tilt -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" transform="rotate(-15)"/>
    
    <!-- Pendulum weight (bob) -->
    <circle cx="4.2" cy="24" r="5" fill="#FF6B6B"/>
    
    <!-- Center pivot point -->
    <circle cx="0" cy="0" r="2.5" fill="#2c3e50"/>
  </g>
</svg>
