<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" rx="64" fill="#ffffff"/>

  <!-- Line-art metronome: original internal coords, scaled/centered to fit -->
  <g transform="translate(256,266) scale(1.95)" stroke="#22224a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-100,-120)">
      <g transform="translate(0,-60)">

        <!-- Pendulum rod (drawn first, visible through body outline) — tilted 15° -->
        <g transform="rotate(-15,100,197)">
          <line x1="100" y1="88" x2="100" y2="287" stroke-width="3"/>
          <!-- Tempo weight (outline only) -->
          <rect x="93" y="132" width="14" height="11" rx="3" stroke-width="2.5"/>
          <!-- Bob (outline only) -->
          <circle cx="100" cy="283" r="11" stroke-width="2.5"/>
        </g>

        <!-- Metronome body outline (no fill — rod shows through) -->
        <polygon points="58,295 142,295 124,148 76,148" stroke-width="3"/>

        <!-- Scale lines on the body -->
        <line x1="88" y1="173" x2="112" y2="173" stroke-width="1.8"/>
        <line x1="90" y1="188" x2="110" y2="188" stroke-width="1.8"/>
        <line x1="90" y1="203" x2="110" y2="203" stroke-width="1.8"/>
        <line x1="90" y1="218" x2="110" y2="218" stroke-width="1.8"/>
        <line x1="88" y1="233" x2="112" y2="233" stroke-width="1.8"/>

        <!-- Pivot pin -->
        <circle cx="100" cy="197" r="4" stroke-width="2"/>

      </g>
    </g>
  </g>
</svg>
