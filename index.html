<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metronome Playlist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <!-- ES module import map: Preact + HTM loaded from CDN, no build step needed -->
  <script type="importmap">
  {
    "imports": {
      "preact":        "https://esm.sh/preact@10.25.4",
      "preact/hooks":  "https://esm.sh/preact@10.25.4/hooks",
      "htm/preact":    "https://esm.sh/htm@3.1.1/preact"
    }
  }
  </script>
</head>
<body>
  <div id="app">

    <!-- ===== LEFT: Player Panel ===== -->
    <div id="player-panel">
      <header class="panel-header">
        <h1>🎵 Metronome Playlist</h1>
        <button id="toggle-editor-btn" class="header-btn" title="Toggle Edit Mode" aria-pressed="false" aria-label="Toggle Edit Mode">✏️ Toggle Edit Mode</button>
      </header>

      <!-- Current song info + prev/next -->
      <song-info id="song-info"></song-info>

      <!-- Visual metronome + transport controls (managed by <metronome-player>) -->
      <metronome-player id="metronome-player"></metronome-player>
    </div><!-- /player-panel -->

    <!-- ===== RIGHT: Editor Panel ===== -->
    <editor-panel id="editor-panel"></editor-panel><!-- /editor-panel -->

  </div><!-- /app -->

  <!-- Song info component (ES module — must load before app.js) -->
  <script type="module" src="song-info-component.js"></script>
  <!-- Editor panel component (ES module — must load before app.js) -->
  <script type="module" src="editor-panel-component.js"></script>
  <!-- Metronome component (ES module — must load before app.js) -->
  <script type="module" src="metronome-component.js"></script>
  <!-- Monaco Editor loader from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
