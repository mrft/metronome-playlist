<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metronome Playlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ===== LEFT: Player Panel ===== -->
    <div id="player-panel">
      <header class="panel-header">
        <h1>🎵 Metronome Playlist</h1>
        <button id="toggle-editor-btn" class="header-btn" title="Toggle editor">✏️ Editor</button>
      </header>

      <!-- Current song info + prev/next -->
      <section id="song-info">
        <div id="song-name">No playlist loaded</div>
        <div id="song-meta"></div>
        <div id="song-nav">
          <button id="prev-song-btn" class="nav-btn" title="Previous song">&#9664;</button>
          <span id="song-position"></span>
          <button id="next-song-btn" class="nav-btn" title="Next song">&#9654;</button>
        </div>
      </section>

      <!-- Visual metronome -->
      <section id="metronome-visual">
        <svg id="pendulum-svg" viewBox="0 0 200 305" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pendulum metronome">

          <!-- Metronome body (pyramid / trapezoid) -->
          <polygon points="58,295 142,295 124,148 76,148" fill="#1a1a38"/>
          <polygon points="60,293 140,293 122,150 78,150" fill="#22224a"/>

          <!-- Scale lines on the body -->
          <line x1="88" y1="173" x2="112" y2="173" stroke="#35356a" stroke-width="1.2"/>
          <line x1="90" y1="188" x2="110" y2="188" stroke="#35356a" stroke-width="1.2"/>
          <line x1="90" y1="203" x2="110" y2="203" stroke="#35356a" stroke-width="1.2"/>
          <line x1="90" y1="218" x2="110" y2="218" stroke="#35356a" stroke-width="1.2"/>
          <line x1="88" y1="233" x2="112" y2="233" stroke="#35356a" stroke-width="1.2"/>

          <!-- Pendulum group — rotates around the pivot at (100, 197) -->
          <g id="pendulum">
            <!-- Rod (runs from top tail through pivot to bob) -->
            <line x1="100" y1="60" x2="100" y2="287" stroke="#c0c0de" stroke-width="2.2" stroke-linecap="round"/>
            <!-- BPM weight (position on rod indicates tempo) -->
            <rect id="weight-rect" x="93" y="108" width="14" height="11" rx="3" fill="#6060c0"/>
            <!-- Bob at the bottom of the rod -->
            <circle id="pendulum-bob" cx="100" cy="283" r="11" fill="#4a9eff"/>
          </g>

          <!-- Semi-transparent overlay hides lower part of the rod inside the body -->
          <polygon points="60,293 140,293 122,150 78,150" fill="#22224a" opacity="0.65"/>

          <!-- Body outline -->
          <polygon points="58,295 142,295 124,148 76,148" fill="none" stroke="#3a3a72" stroke-width="1.5"/>

          <!-- Pivot pin -->
          <circle cx="100" cy="197" r="5" fill="#666"/>
          <circle cx="100" cy="197" r="2.5" fill="#ccc"/>

          <!-- Beat count display inside body -->
          <text id="beat-text" x="100" y="252" text-anchor="middle"
                fill="#7070a0" font-size="20" font-family="monospace" font-weight="bold">—</text>
        </svg>

        <!-- Row of beat indicator dots -->
        <div id="beat-lights-row" aria-live="polite" aria-label="Beat indicator"></div>
      </section>

      <!-- Transport controls -->
      <section id="controls">
        <button id="play-btn"  class="ctrl-btn play-btn"  title="Play">&#9654; Play</button>
        <button id="pause-btn" class="ctrl-btn pause-btn" title="Pause" disabled>⏸ Pause</button>
        <button id="stop-btn"  class="ctrl-btn stop-btn"  title="Stop"  disabled>&#9632; Stop</button>
        <span class="ctrl-sep"></span>
        <button id="sound-btn" class="ctrl-btn sound-btn sound-on" title="Toggle sound">🔊</button>
      </section>
    </div><!-- /player-panel -->

    <!-- ===== RIGHT: Editor Panel ===== -->
    <div id="editor-panel">
      <header class="panel-header editor-header">
        <span class="editor-title">Playlist Editor <small>(JSON)</small></span>
        <div class="editor-header-right">
          <span id="validation-msg" class="validation-msg"></span>
          <button id="apply-btn" class="ctrl-btn primary" title="Apply playlist (Ctrl+Enter)">Apply ↵</button>
          <button id="close-editor-btn" class="header-btn" title="Close editor">✕</button>
        </div>
      </header>
      <div id="monaco-editor-container"></div>
      <!-- Textarea fallback shown if Monaco CDN is unavailable -->
      <textarea id="fallback-editor" class="fallback-editor" style="display:none"
                aria-label="Playlist JSON editor (fallback)" spellcheck="false"></textarea>
      <!-- Schema reference footer (always visible) -->
      <div id="schema-hint">
        💡 Required: <strong>name</strong> (string) · <strong>tempo</strong> (20–400 BPM) · <strong>beats</strong> (integer).
        Optional: <strong>subdivision</strong> (1–8, default&nbsp;1).
        Press <kbd>Ctrl+Enter</kbd> to apply.
      </div>
    </div><!-- /editor-panel -->

  </div><!-- /app -->

  <!-- Monaco Editor loader from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
